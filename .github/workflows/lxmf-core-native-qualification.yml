name: LXMF core native qualification (opt-in)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-lxmf-replay:
    name: Core-authorized replay to independent LXMF recipient
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the manifest-authorized LXMF provider revision
        id: lxmf-pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          providers = json.loads(Path('.github/adapter-compatibility.json').read_text())
          lxmf = [item for item in providers if item['transport'] == 'lxmf']
          if len(lxmf) != 1:
              raise SystemExit('Expected one manifest-authorized LXMF provider')
          print('repository=' + lxmf[0]['repository'])
          print('ref=' + lxmf[0]['ref'])
          PY
      - name: Checkout the pinned LXMF provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.lxmf-pin.outputs.repository }}
          ref: ${{ steps.lxmf-pin.outputs.ref }}
          path: .adapter
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install core and pinned LXMF SDKs
        run: |
          uv sync --locked --extra dev
          uv run --no-sync python scripts/ci/install_checkout_adapter.py --adapter .adapter --python .venv/bin/python
      - name: Exercise exact-target replay through the native LXMF worker
        run: |
          mkdir -p ci-artifacts/lxmf-core-native
          set -o pipefail
          uv run --no-sync python -m pytest tests/integration/test_lxmf_core_exact_target_replay.py \
            -m "local_integration and lxmf_sdk" \
            -v -rA \
            --basetemp=ci-artifacts/lxmf-core-native/pytest-tmp \
            --junitxml=ci-artifacts/lxmf-core-native/junit.xml \
            2>&1 | tee ci-artifacts/lxmf-core-native/pytest-output.txt
      - name: Enforce pinned scenario execution and independent evidence artifacts
        if: always()
        run: |
          uv run --no-sync python scripts/ci/enforce_test_execution.py \
            --junit ci-artifacts/lxmf-core-native/junit.xml \
            --expect-tests 1 \
            --require-artifact 'ci-artifacts/lxmf-core-native/pytest-output.txt' \
            --require-artifact 'ci-artifacts/lxmf-core-native/pytest-tmp/test_core_replay*/b-ready.json' \
            --require-artifact 'ci-artifacts/lxmf-core-native/pytest-tmp/test_core_replay*/recipient-verdict.json'
      - name: Upload native qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lxmf-core-native-diagnostics-${{ github.sha }}
          path: |
            ci-artifacts/lxmf-core-native/junit.xml
            ci-artifacts/lxmf-core-native/pytest-output.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified recipient evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lxmf-core-native-recipient-${{ github.sha }}
          path: |
            ci-artifacts/lxmf-core-native/pytest-tmp/**/b-ready.json
            ci-artifacts/lxmf-core-native/pytest-tmp/**/recipient-verdict.json
          if-no-files-found: error
          retention-days: 7
