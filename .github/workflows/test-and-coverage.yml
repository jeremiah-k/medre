name: Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "**-review"
  workflow_dispatch:

permissions:
  contents: read

# Source and documentation files are UTF-8; do not inherit Windows CP1252.
env:
  PYTHONUTF8: "1"

jobs:
  merge-readiness:
    name: Merge readiness
    if: always()
    needs:
      [
        adapter-merge-gate,
        quality,
        adapter-plan,
        core,
        test,
        adapter-contract,
        transport-local-integration,
        core-owned-lxmf-integration,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every qualification tier
        env:
          REQUIRED_JOBS_PASSED: ${{ needs.adapter-merge-gate.result == 'success' && needs.quality.result == 'success' && needs.adapter-plan.result == 'success' && needs.core.result == 'success' && needs.test.result == 'success' && needs.adapter-contract.result == 'success' && needs.core-owned-lxmf-integration.result == 'success' }}
          LOCAL_JOBS_PASSED: ${{ needs.transport-local-integration.result == 'success' || (needs.adapter-plan.result == 'success' && needs.adapter-plan.outputs.has_local == 'false' && needs.transport-local-integration.result == 'skipped') }}
        run: |
          if [[ "$REQUIRED_JOBS_PASSED" != "true" || "$LOCAL_JOBS_PASSED" != "true" ]]; then
            echo "::error::A required qualification tier failed, was cancelled, or was skipped."
            exit 1
          fi

  adapter-merge-gate:
    name: Merged adapter compatibility pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: "3.13"
      - name: Reject unmerged adapter dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 python scripts/ci/adapter_matrix.py --check-merged

  quality:
    name: Python quality and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: "3.13"
      - run: uvx --from ruff==0.17.3 ruff check src tests scripts
      - run: uvx --from black==26.10.1 black --check --target-version py311 src tests scripts
      - run: git show --format= --check HEAD
      - name: Check core source with strict mypy
        run: |
          uv sync --locked --extra dev
          uv run --no-sync mypy --no-incremental src/medre

  adapter-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      adapters: ${{ steps.plan.outputs.adapters }}
      contract_matrix: ${{ steps.plan.outputs.contract_matrix }}
      compatibility_matrix: ${{ steps.plan.outputs.compatibility_matrix }}
      by_transport: ${{ steps.plan.outputs.by_transport }}
      local_adapters: ${{ steps.plan.outputs.local_adapters }}
      has_local: ${{ steps.plan.outputs.has_local }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: "3.13"
      - name: Snapshot adapter compatibility revisions
        id: plan
        run: uv run --no-project --python 3.13 python scripts/ci/adapter_matrix.py --resolve --github-output "$GITHUB_OUTPUT"

  core:
    name: Core without adapters (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11", shard: 0, shards: 1 }
          - { os: ubuntu-latest, python-version: "3.13", shard: 0, shards: 1 }
          - { os: macos-latest, python-version: "3.13", shard: 0, shards: 1 }
          - { os: windows-latest, python-version: "3.13", shard: 0, shards: 8 }
          - { os: windows-latest, python-version: "3.13", shard: 1, shards: 8 }
          - { os: windows-latest, python-version: "3.13", shard: 2, shards: 8 }
          - { os: windows-latest, python-version: "3.13", shard: 3, shards: 8 }
          - { os: windows-latest, python-version: "3.13", shard: 4, shards: 8 }
          - { os: windows-latest, python-version: "3.13", shard: 5, shards: 8 }
          - { os: windows-latest, python-version: "3.13", shard: 6, shards: 8 }
          - { os: windows-latest, python-version: "3.13", shard: 7, shards: 8 }
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - name: Verify core contracts with no installed adapters
        run: |
          uv run --no-sync python -m pytest tests/ --core-only \
            --core-shard "${{ matrix.shard }}" --core-shards "${{ matrix.shards }}" \
            -q -ra --durations=20 --durations-min=1
      - name: Verify core wheel outside its checkout
        if: matrix.shard == 0
        run: uv run --no-sync python scripts/check_installed_package.py

  test:
    name: Core and cross-adapter compatibility (py${{ matrix.python-version }})
    needs: adapter-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.adapter-plan.outputs.compatibility_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Install compatibility snapshot without SDKs
        uses: ./.github/actions/install-adapters
        with:
          snapshot: ${{ needs.adapter-plan.outputs.adapters }}

      - name: Validate example configs
        run: |
          uv run --no-sync bash scripts/ci/validate-example-configs.sh

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: |
          verbosity="-q"
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            # Keep one fast matrix leg human-readable without multiplying
            # per-test log volume across every supported interpreter.
            verbosity="-v"
          fi
          uv run --no-sync python -m pytest tests/ "$verbosity" -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak and not matrix_sdk and not lxmf_sdk and not meshtastic_sdk and not meshcore_sdk" \
            --durations=25 \
            --durations-min=0.5 \
            --junitxml=junit.xml

      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: |
          uv run --no-sync python -m pytest tests/ -q -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak and not matrix_sdk and not lxmf_sdk and not meshtastic_sdk and not meshcore_sdk" \
            --durations=25 \
            --durations-min=0.5 \
            --cov \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jeremiah-k/medre
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  adapter-contract:
    name: Adapter contract (${{ matrix.provider.transport }}, py${{ matrix.python-version }})
    needs: adapter-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.adapter-plan.outputs.contract_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout adapter at the shared snapshot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.provider.repository }}
          ref: ${{ matrix.provider.ref }}
          path: .adapter
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install core and adapter-owned dependencies
        run: |
          uv sync --locked --extra dev
          uv run --no-sync python scripts/ci/install_checkout_adapter.py --adapter .adapter --test --python .venv/bin/python
      - name: Prefetch the official SimpleX native release
        if: matrix.provider.transport == 'simplexchat'
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/adapter-native-cache
        run: .venv/bin/python -m simplex_chat install
      - name: Run adapter-owned unit and SDK contracts
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/adapter-native-cache
        working-directory: .adapter
        run: |
          ../.venv/bin/python -m pytest -q -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak"

  transport-local-integration:
    if: needs.adapter-plan.outputs.has_local == 'true'
    name: Local integration (${{ matrix.transport }})
    needs: adapter-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.adapter-plan.outputs.local_adapters) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: .adapter
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv sync --locked --extra dev
          uv pip install -e ".adapter[test]"
      - name: Run deterministic local integration
        working-directory: .adapter
        run: ../.venv/bin/python -m pytest -v -m "local_integration and not soak"
      - name: Qualify core-authorized MeshCore replay
        if: matrix.transport == 'meshcore'
        run: |
          mkdir -p ci-artifacts/meshcore-native
          set -o pipefail
          uv run --no-sync python -m pytest tests/integration/test_meshcore_exact_target_replay.py \
            -m "local_integration and meshcore_sdk" -v -rA \
            --basetemp=ci-artifacts/meshcore-native/pytest-tmp \
            --junitxml=ci-artifacts/meshcore-native/junit.xml \
            2>&1 | tee ci-artifacts/meshcore-native/pytest-output.txt
      - name: Enforce MeshCore execution and proof provenance
        if: always() && matrix.transport == 'meshcore'
        run: |
          uv run --no-sync python scripts/ci/enforce_test_execution.py \
            --junit ci-artifacts/meshcore-native/junit.xml --expect-tests 12 \
            --require-artifact 'ci-artifacts/meshcore-native/pytest-tmp/test_core_replay_companion_acc0/qualification.json' \
            --require-artifact 'ci-artifacts/meshcore-native/pytest-tmp/test_core_replay_companion_acc1/qualification.json'
          uv run --no-sync python scripts/ci/native_qualification.py \
            'ci-artifacts/meshcore-native/pytest-tmp/test_core_replay_companion_acc[01]/qualification.json' \
            --expect-records 2
      - name: Upload verified MeshCore proof
        if: success() && matrix.transport == 'meshcore'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshcore-native-proof-${{ github.sha }}
          path: ci-artifacts/meshcore-native/pytest-tmp/**/qualification.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload MeshCore qualification diagnostics
        if: always() && matrix.transport == 'meshcore'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshcore-native-diagnostics-${{ github.sha }}
          path: |
            ci-artifacts/meshcore-native/junit.xml
            ci-artifacts/meshcore-native/pytest-output.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Run opt-in local soak
        if: github.event_name == 'workflow_dispatch'
        working-directory: .adapter
        run: ../.venv/bin/python -m pytest -v -m "local_integration and soak"

  core-owned-lxmf-integration:
    name: Core-owned LXMF native integration
    needs: adapter-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the pinned lxmf adapter at the shared snapshot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.adapter-plan.outputs.by_transport).lxmf.repository }}
          ref: ${{ fromJSON(needs.adapter-plan.outputs.by_transport).lxmf.ref }}
          path: .adapter
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install core and the pinned lxmf adapter SDKs
        run: |
          uv sync --locked --extra dev
          uv run --no-sync python scripts/ci/install_checkout_adapter.py --adapter .adapter --python .venv/bin/python
      - name: Run the core-owned LXMF exact-target propagation suite
        run: |
          mkdir -p ci-artifacts/core-owned-lxmf-integration
          uv run --no-sync python -m pytest tests/integration/test_lxmf_exact_target_propagation.py \
            -m "local_integration and lxmf_sdk" \
            -v -rA \
            --basetemp=ci-artifacts/core-owned-lxmf-integration/pytest-tmp \
            --junitxml=ci-artifacts/core-owned-lxmf-integration/junit.xml \
            2>&1 | tee ci-artifacts/core-owned-lxmf-integration/pytest-output.txt
      - name: Enforce executed-at-pin qualification
        if: always()
        run: |
          uv run --no-sync python scripts/ci/enforce_test_execution.py \
            --junit ci-artifacts/core-owned-lxmf-integration/junit.xml \
            --expect-tests 2 \
            --require-artifact 'ci-artifacts/core-owned-lxmf-integration/pytest-output.txt' \
            --require-artifact 'ci-artifacts/core-owned-lxmf-integration/pytest-tmp/test_propagated_delivery*/b-ready.json' \
            --require-artifact 'ci-artifacts/core-owned-lxmf-integration/pytest-tmp/test_propagated_delivery*/b-received.json' \
            --require-artifact 'ci-artifacts/core-owned-lxmf-integration/pytest-tmp/test_unobserved_exact_dest*/b-ready.json' \
            --require-artifact 'ci-artifacts/core-owned-lxmf-integration/pytest-tmp/test_unobserved_exact_dest*/b-received.json'
      - name: Upload disposable qualification run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-owned-lxmf-integration-${{ github.sha }}
          path: |
            ci-artifacts/core-owned-lxmf-integration/junit.xml
            ci-artifacts/core-owned-lxmf-integration/pytest-output.txt
            ci-artifacts/core-owned-lxmf-integration/pytest-tmp/**/b-ready.json
            ci-artifacts/core-owned-lxmf-integration/pytest-tmp/**/b-received.json
          if-no-files-found: error
          retention-days: 7
