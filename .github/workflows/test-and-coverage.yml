name: Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "**-review"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Validate example configs
        run: |
          uv run --no-sync bash scripts/ci/validate-example-configs.sh

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: |
          verbosity="-q"
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            # Keep one fast matrix leg human-readable without multiplying
            # per-test log volume across every supported interpreter.
            verbosity="-v"
          fi
          uv run --no-sync python -m pytest tests/ "$verbosity" -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak and not matrix_sdk and not lxmf_sdk and not meshtastic_sdk and not meshcore_sdk" \
            --durations=25 \
            --durations-min=0.5 \
            --junitxml=junit.xml

      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: |
          uv run --no-sync python -m pytest tests/ -q -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak and not matrix_sdk and not lxmf_sdk and not meshtastic_sdk and not meshcore_sdk" \
            --durations=25 \
            --durations-min=0.5 \
            --cov \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jeremiah-k/medre
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Verify installed wheel artifact
        if: matrix.python-version == '3.13'
        run: |
          uv run --no-sync python scripts/check_installed_package.py
  matrix-sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: .tool-versions
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Matrix SDK contract dependencies
        run: |
          uv sync --locked --extra dev --extra matrix

      - name: Verify pinned mindroom-nio contract
        run: |
          uv run --no-sync python -m pytest tests/test_matrix_sync_recovery_sdk_contract.py -v \
            -m matrix_sdk

  adapter-sdk-contract:
    name: adapter-sdk-contract (${{ matrix.adapter }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        adapter: [lxmf, meshtastic, meshcore]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ${{ matrix.adapter }} SDK contract dependencies
        run: |
          uv sync --locked --extra dev --extra "${{ matrix.adapter }}"

      - name: Verify declared ${{ matrix.adapter }} SDK contract
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          case "$ADAPTER" in
            lxmf)
              test_file="tests/test_lxmf_sdk_contract.py"
              marker="lxmf_sdk"
              ;;
            meshtastic)
              test_file="tests/test_meshtastic_sdk_contract.py"
              marker="meshtastic_sdk"
              ;;
            meshcore)
              test_file="tests/test_meshcore_pinned_sdk_contract.py"
              marker="meshcore_sdk"
              ;;
            *)
              echo "Unsupported adapter contract: $ADAPTER" >&2
              exit 2
              ;;
          esac
          uv run --no-sync python -m pytest "$test_file" -v -m "$marker"

  transport-local-integration:
    name: transport-local-integration (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [lxmf, meshcore]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: .tool-versions
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ${{ matrix.adapter }} local-integration dependencies
        run: |
          uv sync --locked --extra dev --extra "${{ matrix.adapter }}"

      - name: Run deterministic local integration
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          case "$ADAPTER" in
            lxmf)
              test_file="tests/integration/test_lxmf_local_integration.py"
              sdk_marker="lxmf_sdk"
              ;;
            meshcore)
              test_file="tests/integration/test_meshcore_local_integration.py"
              sdk_marker="meshcore_sdk"
              ;;
            *)
              echo "Unsupported local integration adapter: $ADAPTER" >&2
              exit 2
              ;;
          esac
          uv run --no-sync python -m pytest "$test_file" -v \
            -m "local_integration and $sdk_marker and not soak"

  transport-local-soak:
    if: github.event_name == 'workflow_dispatch'
    name: transport-local-soak (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [lxmf, meshcore]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: .tool-versions
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ${{ matrix.adapter }} soak dependencies
        run: |
          uv sync --locked --extra dev --extra "${{ matrix.adapter }}"

      - name: Run local integration soak
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          case "$ADAPTER" in
            lxmf)
              test_file="tests/integration/test_lxmf_local_integration.py"
              sdk_marker="lxmf_sdk"
              ;;
            meshcore)
              test_file="tests/integration/test_meshcore_local_integration.py"
              sdk_marker="meshcore_sdk"
              ;;
            *)
              echo "Unsupported soak adapter: $ADAPTER" >&2
              exit 2
              ;;
          esac
          uv run --no-sync python -m pytest "$test_file" -v \
            -m "local_integration and $sdk_marker and soak"
