name: Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "**-review"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      adapters: ${{ steps.plan.outputs.adapters }}
      local_adapters: ${{ steps.plan.outputs.local_adapters }}
      has_local: ${{ steps.plan.outputs.has_local }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Snapshot adapter compatibility revisions
        id: plan
        run: python scripts/ci/adapter_matrix.py --resolve --github-output "$GITHUB_OUTPUT"

  core:
    name: Core without adapters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - name: Verify core contracts with no installed adapters
        run: |
          uv run --no-sync python -m pytest -q \
            tests/test_core_independence.py tests/test_external_adapter_discovery.py \
            tests/test_community_adapter_contract.py tests/test_adapter_installation.py \
            tests/test_installed_package_proof.py tests/test_ci_adapter_matrix.py \
            tests/test_generic_adapter_config.py tests/test_recovery_transport_independence.py \
            tests/test_smoke_transport_independence.py \
            tests/test_runtime_config_schema.py tests/test_canonical_events.py \
            tests/test_canonical_event_validation.py tests/test_canonical_event_serialization.py \
            tests/test_routing.py tests/test_fake_adapters.py
      - name: Verify core wheel outside its checkout
        run: uv run --no-sync python scripts/check_installed_package.py

  test:
    name: Core and cross-adapter compatibility (py${{ matrix.python-version }})
    needs: adapter-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Install compatibility snapshot without SDKs
        uses: ./.github/actions/install-adapters
        with:
          snapshot: ${{ needs.adapter-plan.outputs.adapters }}

      - name: Validate example configs
        run: |
          uv run --no-sync bash scripts/ci/validate-example-configs.sh

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: |
          verbosity="-q"
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            # Keep one fast matrix leg human-readable without multiplying
            # per-test log volume across every supported interpreter.
            verbosity="-v"
          fi
          uv run --no-sync python -m pytest tests/ "$verbosity" -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak and not matrix_sdk and not lxmf_sdk and not meshtastic_sdk and not meshcore_sdk" \
            --durations=25 \
            --durations-min=0.5 \
            --junitxml=junit.xml

      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: |
          uv run --no-sync python -m pytest tests/ -q -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak and not matrix_sdk and not lxmf_sdk and not meshtastic_sdk and not meshcore_sdk" \
            --durations=25 \
            --durations-min=0.5 \
            --cov \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jeremiah-k/medre
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  adapter-contract:
    name: Adapter contract (${{ matrix.provider.transport }}, py${{ matrix.python-version }})
    needs: adapter-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        provider: ${{ fromJSON(needs.adapter-plan.outputs.adapters).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout adapter at the shared snapshot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.provider.repository }}
          ref: ${{ matrix.provider.ref }}
          path: .adapter
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install core and adapter-owned dependencies
        env:
          ADAPTER_EXTRAS: ${{ matrix.provider.extras }}
        run: |
          uv sync --locked --extra dev
          uv pip install -e ".adapter[test${ADAPTER_EXTRAS:+,$ADAPTER_EXTRAS}]"
      - name: Run adapter-owned unit and SDK contracts
        working-directory: .adapter
        run: |
          ../.venv/bin/python -m pytest -q -ra \
            -m "not live and not docker and not hardware and not local_integration and not soak"

  transport-local-integration:
    if: needs.adapter-plan.outputs.has_local == 'true'
    name: Local integration (${{ matrix.transport }})
    needs: adapter-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.adapter-plan.outputs.local_adapters) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: .adapter
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv sync --locked --extra dev
          uv pip install -e ".adapter[test]"
      - name: Run deterministic local integration
        working-directory: .adapter
        run: ../.venv/bin/python -m pytest -v -m "local_integration and not soak"
      - name: Run opt-in local soak
        if: github.event_name == 'workflow_dispatch'
        working-directory: .adapter
        run: ../.venv/bin/python -m pytest -v -m "local_integration and soak"
