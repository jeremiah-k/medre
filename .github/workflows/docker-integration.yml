name: Docker Integration

on:
  pull_request:
    branches:
      - main
      - "**-review"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Pinned, validated image references for deterministic CI behavior.
      # Source of truth: docker-compose.integration.yaml (kept in sync by
      # tests/test_integration_image_alignment.py). Update digests when
      # bumping versions — verify with:
      #   docker pull matrixdotorg/synapse:v1.162.0 && docker image inspect --format='{{index .RepoDigests 0}}' matrixdotorg/synapse:v1.162.0
      MEDRE_SYNAPSE_IMAGE: matrixdotorg/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311
      MEDRE_MESHTASTICD_IMAGE: meshtastic/meshtasticd:2.7.26@sha256:23e92b1331a3a471eaef0c63cbca4365ca40b3111a9781cfdbe5a5114e5773d4
      MEDRE_CI_ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/docker-integration
      # Step-level `if` cannot reference the secrets context (actionlint);
      # surface credential presence through job env instead.
      MEDRE_DOCKERHUB_CREDS_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      MEDRE_DOCKER_READY_TIMEOUT: "120"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Docker image caching ---
      # Caches the Synapse image tar to avoid re-pulling on every run.
      # The meshtasticd image is NOT cached: it is digest-pinned
      # (name:tag@sha256:...), and docker save/load of a digest-pinned
      # reference produces a tar that restores without the tag or repo
      # digest — the restored image can neither satisfy the conftest's
      # digest-qualified `docker image inspect` nor the digest-pinned
      # `docker run`.  The image is therefore pulled at setup, where the
      # integration conftest retries transient registry rejections.

      - name: Derive Synapse image cache metadata
        id: synapse-cache
        shell: bash
        run: |
          set -euo pipefail
          image="${MEDRE_SYNAPSE_IMAGE}"
          # Derive a stable cache key from the image name
          cache_key="${RUNNER_OS}-synapse-image-$(echo -n "${image}" | sha256sum | awk '{print $1}')"
          cache_path="${RUNNER_TEMP}/synapse-image-cache/${cache_key}.tar"
          {
            echo "cache_key=${cache_key}"
            echo "cache_path=${cache_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore cached Synapse image
        id: synapse-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.synapse-cache.outputs.cache_path }}
          key: ${{ steps.synapse-cache.outputs.cache_key }}

      - name: Load cached Synapse image
        if: ${{ steps.synapse-image-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "${{ steps.synapse-cache.outputs.cache_path }}"

      # Docker Hub login for higher rate limits (200 vs 100 pulls/6h).
      # Optional: runs only when credentials are configured, so unset
      # secrets skip the step instead of erroring on every run. Pulls
      # still work anonymously without them.
      - name: Log in to Docker Hub
        if: env.MEDRE_DOCKERHUB_CREDS_CONFIGURED == 'true'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Python setup ---

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install MEDRE with integration extras
        run: |
          uv sync --locked --extra dev --extra matrix --extra meshtastic

      # --- Run tests ---

      - name: Run Docker integration tests
        run: |
          uv run --no-sync timeout --foreground 13m bash scripts/ci/run-docker-integration.sh

      # --- Post-run: save image caches ---

      - name: Save Synapse image tar
        if: ${{ always() && steps.synapse-image-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cache_path="${{ steps.synapse-cache.outputs.cache_path }}"
          mkdir -p "$(dirname "${cache_path}")"
          docker save "${MEDRE_SYNAPSE_IMAGE}" -o "${cache_path}"

      - name: Persist cached Synapse image
        if: ${{ always() && steps.synapse-image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.synapse-cache.outputs.cache_path }}
          key: ${{ steps.synapse-cache.outputs.cache_key }}

      # --- Artifact upload ---

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-integration-logs
          path: |
            ${{ env.MEDRE_CI_ARTIFACT_DIR }}/**/*
          if-no-files-found: warn
          retention-days: 7
