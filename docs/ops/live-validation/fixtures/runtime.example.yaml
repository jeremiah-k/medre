# Dedicated lab settings. Replace placeholders before enabling native sends.
adapters:
  matrix:
    matrix:
      enabled: true
      adapter_kind: real
      homeserver: https://matrix.example.org
      user_id: "@medre:matrix.example.org"
      access_token: ""
      room_allowlist:
        - "!campaign:matrix.example.org"
      encryption_mode: plaintext
      origin_label: Matrix lab
  meshtastic:
    mt:
      enabled: true
      adapter_kind: real
      connection_type: serial
      serial_port: /dev/serial/by-id/replace-with-medre-radio
      default_channel: 0
      message_delay_seconds: 2.5
      origin_label: Forx
  meshcore:
    mc:
      enabled: true
      adapter_kind: real
      connection_type: ble
      ble_address: AA:BB:CC:DD:EE:01
      default_channel: 1
      identity: MEDRE-MC
      message_delay_seconds: 2.5
      origin_label: MeshCore lab
      meshcore_relay_prefix: "[{origin_label}] {sender}: "
  lxmf:
    lx:
      enabled: true
      adapter_kind: real
      connection_type: reticulum
      identity_path: /private/bench/lx-medre.identity
      reticulum_config_dir: /private/bench/rns-medre
      storage_path: /private/bench/lx-medre-storage
      default_delivery_method: direct
      announce_interval_seconds: 8
      stamp_cost: 0
      origin_label: Reticulum lab
      lxmf_relay_prefix: "[{origin_label}] {sender}: "
  xmpp:
    xmpp:
      enabled: true
      adapter_kind: real
      jid: medre@example.org/bridge
      password: ""
      nickname: medre
      rooms:
        - campaign@conference.example.org
      origin_label: XMPP lab
  chatmail:
    chatmail:
      enabled: true
      adapter_kind: real
      accounts_dir: /private/bench/mail-medre
      account_id: 1
      chats:
        - 12
      state_dir: /private/bench/mail-medre-journal
      origin_label: Chatmail lab
  simplexchat:
    sx:
      enabled: true
      adapter_kind: real
      database_prefix: /private/bench/simplex-medre/profile
      user_id: 1
      chats: [group:7]
      origin_label: SimpleX lab
