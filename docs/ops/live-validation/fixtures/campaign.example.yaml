# Replace endpoint addresses AND these example native peer display names.
# Prefixes describe rendered bodies; MeshCore firmware sender headers are separate.
version: 1
runtime_config: runtime.yaml
timeout_seconds: 90
pacing_seconds: 2.5
settle_seconds: 5
endpoints:
  matrix:
    transport: matrix
    channel: "!campaign:matrix.example.org"
    expected_sender: "@medre:matrix.example.org"
    peer:
      homeserver: https://matrix.example.org
      user_id: "@peer:matrix.example.org"
      access_token: ""
    expected_prefixes:
      mt: "[MeshPeer/Forx]: "
      mc: "[MeshCorePeer/MeshCore lab]: "
      lx: "[LXMFPeer/Reticulum lab]: "
      xmpp: "[peer/XMPP lab]: "
      chatmail: "[peer@example.org/Chatmail lab]: "
  mt:
    transport: meshtastic
    channel: "0"
    expected_sender: "123456789"
    peer:
      serial_port: /dev/serial/by-id/replace-with-peer-radio
    expected_prefixes:
      matrix: "Peer[M]: "
      mc: "MeshCorePeer: "
      lx: "LXMFPeer: "
      xmpp: "peer: "
      chatmail: "peer@example.org: "
  mc:
    transport: meshcore
    channel: "1"
    expected_sender: MEDRE-MC
    peer:
      ble_address: AA:BB:CC:DD:EE:02
    expected_prefixes:
      matrix: "[Matrix lab] Peer: "
      mt: "[Forx] MeshPeer: "
      lx: "[Reticulum lab] LXMFPeer: "
      xmpp: "[XMPP lab] peer: "
      chatmail: "[Chatmail lab] peer@example.org: "
  lx:
    transport: lxmf
    channel: abababababababababababababababab
    expected_sender: cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
    peer:
      identity_path: /private/bench/lx-peer.identity
      reticulum_config_dir: /private/bench/rns-peer
      storage_path: /private/bench/lx-peer-storage
    expected_prefixes:
      matrix: "[Matrix lab] Peer: "
      mt: "[Forx] MeshPeer: "
      mc: "[MeshCore lab] MeshCorePeer: "
      xmpp: "[XMPP lab] peer: "
      chatmail: "[Chatmail lab] peer@example.org: "
  xmpp:
    transport: xmpp
    channel: campaign@conference.example.org
    expected_sender: campaign@conference.example.org/medre
    peer:
      jid: peer@example.org/campaign
      password: ""
      nickname: peer
    expected_prefixes:
      matrix: "[Matrix lab] Peer: "
      mt: "[Forx] MeshPeer: "
      mc: "[MeshCore lab] MeshCorePeer: "
      lx: "[Reticulum lab] LXMFPeer: "
      chatmail: "[Chatmail lab] peer@example.org: "
  chatmail:
    transport: chatmail
    channel: "12"
    expected_sender: "14"
    peer:
      accounts_dir: /private/bench/mail-peer
      account_id: 1
      channel: "15"
    expected_prefixes:
      matrix: "[Matrix lab] Peer: "
      mt: "[Forx] MeshPeer: "
      mc: "[MeshCore lab] MeshCorePeer: "
      lx: "[Reticulum lab] LXMFPeer: "
      xmpp: "[XMPP lab] peer: "
