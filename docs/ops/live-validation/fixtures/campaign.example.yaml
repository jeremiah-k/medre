# Copy to a private lab directory alongside runtime.yaml, then edit endpoints.
version: 1
runtime_config: runtime.yaml
timeout_seconds: 90
pacing_seconds: 2.5
settle_seconds: 5
endpoints:
  matrix:
    transport: matrix
    channel: "!campaign:matrix.example.org"
    expected_sender: "@medre:matrix.example.org"
    peer:
      homeserver: https://matrix.example.org
      user_id: "@peer:matrix.example.org"
      access_token: "" # Set the dedicated peer account's token.
  mt:
    transport: meshtastic
    channel: "0"
    expected_sender: "123456789"
    peer:
      serial_port: /dev/serial/by-id/replace-with-peer-radio
      # TCP alternative: host: 127.0.0.1, port: 4404.
  mc:
    transport: meshcore
    channel: "1"
    expected_sender: MEDRE-MC
    peer:
      ble_address: AA:BB:CC:DD:EE:02
      # Serial alternative: serial_port: /dev/serial/by-id/peer, baudrate: 115200.
  lx:
    transport: lxmf
    channel: abababababababababababababababab # Independent peer destination.
    expected_sender: cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd # MEDRE destination.
    peer:
      identity_path: /private/bench/lx-peer.identity
      reticulum_config_dir: /private/bench/rns-peer
      storage_path: /private/bench/lx-peer-storage
  xmpp:
    transport: xmpp
    channel: campaign@conference.example.org
    expected_sender: campaign@conference.example.org/medre
    peer:
      jid: peer@example.org/campaign
      password: "" # Set the dedicated peer account's password.
      nickname: peer
      # Optional explicit connection: host: example.org, port: 5222.
  chatmail:
    transport: chatmail
    channel: "12" # Group ID in MEDRE's profile.
    expected_sender: "14" # Bot contact ID in the peer's profile.
    peer:
      accounts_dir: /private/bench/mail-peer
      account_id: 1
      channel: "15" # The same group's ID in the peer's profile.
      # Optional absolute rpc_server_path when the executable is outside PATH.
