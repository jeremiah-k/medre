# Tool versions live here; Python policy lives in pyproject.toml.
# Frozen schema bytes and the upstream launcher are not formatter inputs.
# pinact 5 uses long flags; the pinned plugin still supplies v4 flags.
version: 0.1
cli:
  version: 1.29.0 # renovate: datasource=github-releases depName=trunk-io/trunk
plugins:
  sources:
    - id: trunk
      ref: v1.11.0 # renovate: datasource=github-tags depName=trunk-io/plugins
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
lint:
  # Type checking needs installed dependencies, outside the Trunk sandbox.
  disabled:
    - mypy
  enabled:
    - hadolint@2.15.1 # renovate: datasource=github-releases depName=hadolint/hadolint
    - pinact@5.0.2 # renovate: datasource=github-releases depName=suzuki-shunsuke/pinact
    - actionlint@1.7.12 # renovate: datasource=github-releases depName=rhysd/actionlint
    - bandit@1.9.4 # renovate: datasource=pypi depName=bandit
    - black@26.10.1 # renovate: datasource=pypi depName=black
    - checkov@3.4.5 # renovate: datasource=pypi depName=checkov
    - isort@9.0.2 # renovate: datasource=pypi depName=isort
    - renovate@44.239.1 # renovate: datasource=npm depName=renovate
    - ruff@0.17.5 # renovate: datasource=pypi depName=ruff
    - shellcheck@0.11.0 # renovate: datasource=github-releases depName=koalaman/shellcheck
    - shfmt@3.14.1 # renovate: datasource=github-releases depName=mvdan/sh
    - taplo@0.10.0 # renovate: datasource=github-releases depName=tamasfe/taplo
    - yamllint@1.38.0 # renovate: datasource=pypi depName=yamllint
    - git-diff-check
    - markdownlint@0.50.0 # renovate: datasource=npm depName=markdownlint-cli
    - prettier@3.10.1 # renovate: datasource=npm depName=prettier
    - trufflehog@3.99.9 # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
  definitions:
    - name: black
      direct_configs:
        - pyproject.toml
    - name: ruff
      direct_configs:
        - pyproject.toml
    - name: isort
      direct_configs:
        - pyproject.toml
    - name: pinact
      commands:
        - name: lint
          run: pinact run --format sarif --no-api ${target}
          output: sarif
          success_codes:
            - 0
            - 1
            - 2
            - 3
          batch: true
          read_output_from: stdout
          is_security: true
          disable_upstream: true
    - name: bandit
      direct_configs:
        - .bandit.yaml
      commands:
        - name: lint
          run: bandit --exit-zero -c .bandit.yaml --format json --output ${tmpfile} ${target}
          read_output_from: tmp_file
  ignore:
    - linters:
        - ALL
      paths:
        - docs/schemas/**
        - .trunk/trunk
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
