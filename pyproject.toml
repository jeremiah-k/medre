[project]
name = "medre"
version = "0.1.0"
description = "Modular event communications runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  # License classifier omitted per PEP 639 — the `license` field above
  # is the SPDX expression and supersedes the Trove classifier.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
  "Typing :: Typed",
]
dependencies = ["msgspec==0.21.1", "pyyaml==6.0.3"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "coverage==7.15.4",
  "build==1.5.0",
  "setuptools==84.0.0",
  "jsonschema==4.26.0",
]
# mindroom-nio v0.40.0 — fork of matrix-nio with MindRoom patches.
matrix = ["mindroom-nio==0.40.0"]
matrix-e2e = ["mindroom-nio[e2e]==0.40.0"]
# mtjk (Meshtastic fork) — ships as distribution "mtjk", imported as "meshtastic".
# PyPubSub is required by mtjk for callback-based packet reception but is not
# declared as a dependency by the mtjk distribution. Included here explicitly.
meshtastic = ["mtjk==2.7.11.post5", "PyPubSub==4.0.7"]
# meshcore v2.3.8.
# Transitive deps: bleak, pyserial-asyncio-fast, pycayennelpp, pycryptodome.
meshcore = ["meshcore==2.3.8"]
# lxmf v1.1.1.
# Reticulum is pinned explicitly so pip-based SDK contract CI cannot drift
# away from the lockfile-compatible RNS surface.
lxmf = ["lxmf==1.1.1", "rns==1.4.2"]

[project.scripts]
medre = "medre.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medre = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: tests that connect to a real service or hardware (skipped by default)",
  "docker: tests requiring Docker services like Synapse or meshtasticd (skipped by default)",
  "matrix_sdk: tests requiring the pinned mindroom-nio Matrix SDK (skipped by default)",
  "lxmf_sdk: tests requiring the pinned LXMF/RNS SDKs (skipped by default)",
  "meshtastic_sdk: tests requiring the pinned mtjk Meshtastic SDK (skipped by default)",
  "meshcore_sdk: tests requiring the pinned meshcore SDK (skipped by default)",
  "local_integration: real pinned SDK plus deterministic local endpoint (skipped by default)",
  "soak: extended-duration or repeated-cycle transport endurance tests (skipped by default)",
  "hardware: tests requiring physical hardware (serial/BLE Meshtastic radios, etc.) — implies live (skipped by default)",
]
addopts = "-m 'not live and not docker and not hardware and not local_integration and not soak and not matrix_sdk and not lxmf_sdk and not meshtastic_sdk and not meshcore_sdk'"
filterwarnings = ["error"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "ASYNC", "RUF100"]
# RUF001-003: en-dashes in prose are intentional style.
# SIM105: try/except-pass reads clearer than contextlib.suppress here.
# ASYNC109: `timeout` parameter naming is the house convention.
# ASYNC230/240: local-disk reads/writes in async CLI and evidence paths
#   are deliberately synchronous (small files, thread-offloaded where it
#   matters); revisit only if a path ever blocks on slow I/O.
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
  "SIM105",
  "ASYNC109",
  "ASYNC230",
  "ASYNC240",
]
