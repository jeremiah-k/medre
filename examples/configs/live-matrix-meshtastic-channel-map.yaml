# MEDRE Example: Live Matrix <-> Meshtastic Bridge with Multi-Context Map
#
# Bridges multiple Meshtastic radio channels to separate Matrix rooms using
# context_map.  Each channel context gets its own dedicated room.
#
# NOT for unattended production.  Use throwaway Matrix rooms and non-critical
# Meshtastic channels.
#
# Prerequisites:
#   pip install ".[matrix,meshtastic]"
#   A Meshtastic radio on /dev/ttyACM0 (or change serial_port below)
#   A Matrix bot account with a valid access token
#
# Usage:
#   medre run --config examples/configs/live-matrix-meshtastic-channel-map.yaml

runtime:
  name: live-context-map
  shutdown_timeout_seconds: 30

logging:
  level: INFO # controls MEDRE namespace only; use DEBUG for bring-up visibility
  format: text
  # Dependency loggers stay quiet by default (root WARNING).
  # Use logging.overrides only when troubleshooting integrations — see docs/ops/configuration.md.

storage:
  backend: sqlite
  path: "{state}/medre.sqlite"

# ---------------------------------------------------------------------------
# Matrix transport
# ---------------------------------------------------------------------------
# Fill in your real homeserver URL, bot credentials, and room IDs below.
# The bot auto-joins every room listed in the context_map dest_context values.
adapters:
  matrix:
    main:
      enabled: true
      homeserver: "" # REQUIRED — your homeserver URL
      user_id: "" # REQUIRED — bot user ID (e.g. @mesh-bot:example.com)
      access_token: "" # REQUIRED — bot access token
      encryption_mode: plaintext # plaintext for bring-up; e2ee_required once vodozemac is installed
      # relay_prefix: "[{sender}/{origin_label}]: "  # Meshtastic→Matrix prefix via target-local config

  # ---------------------------------------------------------------------------
  # Meshtastic transport (serial)
  # ---------------------------------------------------------------------------
  meshtastic:
    radio:
      enabled: true
      connection_type: serial
      serial_port: /dev/ttyACM0
      origin_label: medre-radio
      radio_relay_prefix: "{sender_short}: " # Matrix→Meshtastic prefix

      # # --- TCP alternative (uncomment to use instead of serial) ---
      # connection_type: tcp
      # host: meshtastic.local
      # port: 4403

# ---------------------------------------------------------------------------
# Route — multi-context bridge via context_map
# ---------------------------------------------------------------------------
# context_map expands this single route into one bidirectional pair per
# entry.  The map key is the SOURCE-side opaque context — the context that
# arrives ON the source adapter.  Here the radio side is the source, so the
# keys are Meshtastic channel indices and the dest_context values are
# Matrix rooms on the main adapter.  Every value is a structured table with
# exactly one of dest_context / dest_destination plus optional per-entry
# origin labels.
#
# The bot auto-joins every room listed here.  Contexts not listed in the map
# are silently dropped — packets on unmapped channels are not relayed.
#
# To add more channels, extend the map:
#   "3":
#     dest_context: "!room3:example.com"
#   "4":
#     dest_context: "!room4:example.com"
#   ...

routes:
  radio_map:
    source_adapters:
      - radio
    dest_adapters:
      - main
    directionality: bidirectional
    enabled: true
    context_map:
      "0":
        dest_context: "!general:example.com"
        source_origin_label: General
      "1":
        dest_context: "!admin:example.com"
      "2":
        dest_context: "!alerts:example.com"
      # Per-entry labels override the route-level source_origin_label /
      # dest_origin_label for this entry's legs only; an unset (or omitted)
      # label falls back to the route-level value, then the adapter
      # origin_label. An explicit "" suppresses that fallback.
      # See docs/ops/configuration.md (Per-entry origin labels) and
      # docs/spec/routing-delivery.md §17.5.8.

  # --- Structured-destination alternative route (commented out) ---
  # A separate route at the routes: level (sibling of radio_map above).
  # An entry may target a structured destination entity instead of a dest
  # context (here: a Matrix room relaying into a fixed LXMF destination).
  # Structured-destination entries are forward-only: they require
  # directionality: source_to_dest. Using this route requires adding a
  # matching adapters.lxmf.<id> section (e.g. adapters.lxmf.lxmf-node); no
  # LXMF adapter is defined in this example config.
  #
  # matrix_to_lxmf_peer:
  #   source_adapters:
  #     - main
  #   dest_adapters:
  #     - lxmf-node
  #   directionality: source_to_dest
  #   enabled: true
  #   context_map:
  #     "!room:example.com":
  #       dest_destination:
  #         kind: lxmf_destination
  #         destination_hash: "e5f6a7b8c9d0e1f2a1b2c3d4e5f6a7b8"
  #         destination_name: "mobile-peer-1"

  # --- Fan-in alternative route (commented out) ---
  # Two (or more) source contexts can deliver into the SAME dest context
  # when the route creates no reverse legs. Here the radio side is the
  # source, so fan-in uses directionality: source_to_dest. Duplicate
  # dest_context values are rejected at configuration validation when
  # reverse legs would be created, because a dest-side event from the
  # shared context is ambiguous across source contexts. See
  # docs/spec/routing-delivery.md §17.6.
  #
  # radio_fan_in:
  #   source_adapters:
  #     - radio
  #   dest_adapters:
  #     - main
  #   directionality: source_to_dest
  #   enabled: true
  #   context_map:
  #     "0":
  #       dest_context: "!shared:example.com"
  #       source_origin_label: "LongFast"
  #     "1":
  #       dest_context: "!shared:example.com"
  #       source_origin_label: "ShortFast"
